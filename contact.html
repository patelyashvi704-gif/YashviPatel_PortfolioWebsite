<header class="site-header">
  <a class="brand" href="index.html">Yashvi Patel</a>

  <nav class="nav"><a href="index.html">Home</a><a href="skills.html">Skills</a><a href="projects.html">Projects</a><a href="contact.html" aria-current="page">Contact</a></nav>
</header>
<main>
<section class="band first">
  <h1>Contact</h1>
  <div class="grid two">
    <form id="contact-form" novalidate>
      <label>Name<input type="text" id="name" required></label>
      <label>Email<input type="email" id="email" required></label>
      <label>Message<textarea id="message" rows="5" required></textarea></label>
      <p class="msg" id="form-msg" role="status"></p>
      <button class="btn" type="submit">Send message</button>
    </form>
    <div>
      <h2>Find me online</h2>
      <ul class="links">
        <li><a href="https://www.linkedin.com/in/your-linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://github.com/your-username" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="mailto:your.email@example.com">your.email@example.com</a></li>
      </ul>
      <a class="btn ghost" href="resume.pdf" download>Download resume</a>
    </div>
  </div>
</section>
</main>
